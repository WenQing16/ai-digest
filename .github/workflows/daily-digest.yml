name: AI Builders Digest

on:
  schedule:
    # 10:00 Asia/Shanghai = 02:00 UTC (UTC+8)
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发测试

concurrency:
  group: digest-run
  cancel-in-progress: false

permissions:
  contents: read
  models: read # 未配置 AI_API_KEY 时，用 GITHUB_TOKEN 走 GitHub Models

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=zh | head -5

      - name: Install dependencies
        run: npm ci

      - name: Clone follow-builders skill
        run: |
          git clone --depth=1 https://github.com/zarazhangrui/follow-builders.git
          cd follow-builders/scripts
          npm ci

      - name: Generate digest JSON
        run: |
          cd follow-builders/scripts
          node prepare-digest.js > ../../digest.json
          node -e "const d=require('../../digest.json');console.log('stats:',JSON.stringify(d.stats||{}))"

      # 中文翻译 + 提炼成结构化总结；失败不中断，走下面的降级分支
      - name: Summarize into Chinese
        id: summarize
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/summarize.js < digest.json > summary.json

      - name: Render long image
        if: steps.summarize.outcome == 'success'
        run: node scripts/render-image.js summary.json digest.png

      - name: Send image to Lark
        if: steps.summarize.outcome == 'success'
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_USER_OPEN_ID: ${{ secrets.LARK_USER_OPEN_ID }}
        run: node scripts/send-lark.js digest.png summary.json

      # 降级：LLM 不可用时退回英文原文文本消息，保证不漏报
      - name: Fallback to English text digest
        if: steps.summarize.outcome != 'success'
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_USER_OPEN_ID: ${{ secrets.LARK_USER_OPEN_ID }}
        run: |
          echo "::warning::中文总结生成失败，已降级发送英文原文"
          { echo "**⚠️ 中文总结生成失败，已降级为英文原文**"; echo ""; node scripts/format-digest.js < digest.json; } \
            | node scripts/send-lark.js --text -

      - name: Cleanup
        if: always()
        run: rm -rf follow-builders
